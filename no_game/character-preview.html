<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>챕터별 캐릭터 미리보기</title><style>body{background:#fffaf1;color:#66534b;text-align:center;font:15px sans-serif;margin:24px}main{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}section{border:1px solid #eaded4;border-radius:20px;padding:20px}canvas{width:240px;height:200px;image-rendering:pixelated}p{font-size:13px}</style><h1>얼굴은 그대로, 의상만 변경</h1><main></main><script type="module">import {PixelWorld} from './js/art.js';const titles=['01–02 · 재킷','03 · 청재킷','04–05 · 예복'];const worlds=[];titles.forEach((title,i)=>{const section=document.createElement('section');const h=document.createElement('h2');h.textContent=title;const cv=document.createElement('canvas');cv.width=96;cv.height=80;section.append(h,cv);document.querySelector('main').append(section);worlds.push({art:new PixelWorld(cv),style:i+1});});function frame(t){for(const {art,style} of worlds){art.c.clearRect(0,0,96,80);art.character(30,58,'groom',t,true,style===3,1,false,1,style);art.character(66,58,'bride',t,true,style===3,-1,false,1,style);}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
